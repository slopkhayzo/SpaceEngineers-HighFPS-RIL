; SpaceEngineers.HighFPSFix settings.
; Values are read once, when the game starts.

[General]
; false switches the fix off without removing it.
Enabled = true
; true writes per-second render and interpolation statistics to the log every
; five seconds. Turn it on before reproducing a problem you want to report.
Diagnostics = false

[FrameRate]
; Frame rate cap of the game's render thread (the game's own cap is 120).
;   0  = the refresh rate of the display the game window is on (recommended;
;        followed when the window moves or the display mode changes)
;   -1 = no cap (use VSync or an external limiter instead)
;   any other value = that many frames per second
TargetFPS = 0

[Interpolation]
; The game simulates 60 times per second. With interpolation on, every drawn
; frame shows the world between the two most recent simulation steps, so
; motion is smooth at any frame rate. Off = the extra frames repeat the last
; step (the game's own behaviour, with only the cap raised).
Enabled = true
; Camera position, rotation and field of view.
Camera = true
; Ships, stations, characters, tools, doors, rotors, pistons, debris, and
; everything attached to them (lights, thruster flames, attached particles).
Objects = true
; Skeletal animation of characters (first-person arms and tools included).
Characters = true
; Extra presentation delay in milliseconds, on top of one simulation step plus
; the measured simulation time. Raise it only if motion hitches regularly.
ExtraDelayMs = 0.5
; First person on foot: the camera, your arms and your tool turn with the
; mouse on every drawn frame, instead of 60 times per second with the
; interpolation's delay. The game still receives every mouse movement exactly
; once, in its own simulation steps, so aim and what other players see are
; unchanged. Needs Camera = true.
MouseLook = true
