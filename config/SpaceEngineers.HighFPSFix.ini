; Development default, copied beside the plugin on every build.
; The release INI is packaging/SpaceEngineers.HighFPSFix.ini.

[General]
Enabled = true
Diagnostics = true

[FrameRate]
; 0 = the refresh rate of the display the game is on, -1 = no limit, otherwise frames per second.
TargetFPS = 0

[Interpolation]
Enabled = true
Camera = true
Objects = true
Characters = true
ExtraDelayMs = 0.5
MouseLook = true

[Debug]
AutoLoadWorld =
AutoQuitSeconds = 0
TracePath =
; Synthetic mouse motion once the world is ready (counts per second, 0 = off);
; sent only while the game window is focused and the player is in first person.
AutoMouseSpeed = 0
; Lead on/off every other 8 s repetition of the pattern (A/B in one session).
AutoMouseAlternate = false
; Ask Windows to bring the game window to the front once the world is ready
; (granted only while the machine is not in use).
AutoFocus = false
; false = mouse look learns and traces but does not turn the camera.
MouseLookApply = true
